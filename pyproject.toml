[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netsleuth"
version = "0.1.0"
description = "AI agents that investigate cable network outages, tested in a simulated HFC network."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Chandra Prakash Reddy Kalwakolu" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "polars>=1.0",
    "numpy>=2.0",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["netsleuth"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["netsleuth", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
